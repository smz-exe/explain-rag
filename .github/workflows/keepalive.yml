name: Keepalive

# Pings the production /health endpoint on a schedule.
#
# Why: /health reads paper/chunk counts from PostgreSQL, which resets
# Supabase's free-tier inactivity pause timer (~7 days without queries
# pauses the database and breaks the demo until manually restored).
# The Fly machine wakes from suspend for the request and re-suspends
# shortly after, so the cost impact is negligible.
#
# A failed run also doubles as a lightweight downtime signal (GitHub
# emails the repo owner on scheduled-workflow failures).
#
# Note: GitHub disables scheduled workflows after ~60 days without
# repository activity; a push re-enables them.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the hour to avoid congestion
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            status=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 \
              https://explainrag-api.fly.dev/health || echo "000")
            if [ "$status" = "200" ]; then
              echo "Healthy:"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $attempt returned status $status; retrying in 30s..."
            sleep 30
          done
          echo "Health check failed after 3 attempts"
          exit 1
