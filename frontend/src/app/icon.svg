<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ExplainRAG">
  <title>ExplainRAG</title>
  <rect width="512" height="512" rx="112" fill="#ffffff"/>

  <!-- documents viewed from above-left: vertical shear makes top edges recede up-right -->
  <g transform="skewY(-8)">
    <rect x="95"  y="113" width="175" height="270" rx="38" fill="#d8d8dc"/>
    <rect x="140" y="150" width="175" height="270" rx="38" fill="#c6c6cc"/>
    <rect x="190" y="192" width="190" height="290" rx="38" fill="#ffffff" stroke="#141414" stroke-width="24"/>
    <g stroke="#141414" stroke-width="17" stroke-linecap="round">
      <line x1="222" y1="250" x2="348" y2="250"/>
      <line x1="222" y1="292" x2="325" y2="292"/>
      <line x1="222" y1="334" x2="300" y2="334"/>
    </g>
  </g>

  <!-- knowledge graph: stub to doc corner + triangle, 4 edges -->
  <g stroke="#141414" stroke-width="14" stroke-linecap="round">
    <line x1="398" y1="140" x2="374" y2="160"/>
    <line x1="398" y1="140" x2="434" y2="88"/>
    <line x1="398" y1="140" x2="464" y2="164"/>
    <line x1="434" y1="88"  x2="464" y2="164"/>
  </g>
  <circle cx="434" cy="88"  r="28" fill="#141414"/>
  <circle cx="464" cy="164" r="28" fill="#141414"/>
  <circle cx="398" cy="140" r="19" fill="#5b4ee6"/>

  <!-- magnifier: white knockout, then lens -->
  <circle cx="350" cy="350" r="98" fill="#ffffff"/>
  <line x1="402" y1="402" x2="450" y2="450" stroke="#ffffff" stroke-width="52" stroke-linecap="round"/>
  <g fill="none" stroke="#5b4ee6" stroke-width="30" stroke-linecap="round">
    <circle cx="350" cy="350" r="72"/>
    <line x1="402" y1="402" x2="450" y2="450"/>
  </g>
</svg>
